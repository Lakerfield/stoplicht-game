<import from="../components/game-canvas"></import>
<import from="../components/intersection-panel"></import>
<import from="../resources/time-format"></import>

<div class="play-root">
  <game-canvas></game-canvas>

  <div if.bind="!session.level && !error" class="absolute inset-0 grid place-items-center text-lg">${'app.loading' | t}</div>
  <div if.bind="error" class="absolute inset-0 grid place-items-center p-4 text-center">
    <div class="dialog">
      <p class="text-red-700 mb-4">${error}</p>
      <button type="button" class="btn btn-primary w-full" click.trigger="back()">${'result.menu' | t}</button>
    </div>
  </div>

  <template if.bind="session.level">
    <!-- HUD top: one low row, buttons left, time bar in the middle, counters right -->
    <div class="hud-top">
      <div class="hud-card hud-row hud-buttons p-1!">
        <button type="button" class="btn btn-icon" click.trigger="back()" aria-label="${(fromEditor ? 'hud.backToEditor' : 'hud.menu') | t}">${fromEditor ? '🛠' : '☰'}</button>
        <button type="button" class="btn btn-icon" click.trigger="session.audio.toggleMuted()" aria-label="${'hud.mute' | t}">${session.audio.muted ? '🔇' : '🔊'}</button>
      </div>
      <div class="hud-card hud-row hud-time">
        <span class="hud-level truncate" title="${levelName}"><span class="opacity-60" if.bind="levelNumber">${levelNumber}<span class="hidden sm:inline"> ·</span></span> <span class="hidden sm:inline">${levelName}</span></span>
        <span class="hud-clock font-mono tabular-nums leading-none">${session.time | time}</span>
        <span class="text-xs opacity-70 whitespace-nowrap"><span class="hidden sm:inline">${'hud.target' | t} </span><span class="sm:hidden">▸</span><span class="font-mono tabular-nums">${session.level.targetTime | time}</span></span>
      </div>
      <div class="hud-card hud-row hud-counts text-sm" title="${session.counts.onMap} ${'hud.onMap' | t}, ${session.counts.queued} ${'hud.queued' | t}, ${session.counts.pending} ${'hud.pending' | t}">
        <span class="font-semibold whitespace-nowrap">🚗 ${session.counts.onMap} <span class="opacity-60 font-normal hidden sm:inline">${'hud.onMap' | t}</span></span>
        <span class="whitespace-nowrap"><span class="sm:hidden">⏳</span>${session.counts.queued} <span class="opacity-60 hidden sm:inline">${'hud.queued' | t}</span></span>
        <span class="whitespace-nowrap"><span class="sm:hidden">+</span>${session.counts.pending} <span class="opacity-60 hidden sm:inline">${'hud.pending' | t}</span></span>
      </div>
    </div>

    <!-- tutorial hint (levels 1 and 2) -->
    <div class="hint-bubble" if.bind="showHint">
      <span>💡 ${hintKey | t}</span>
      <button type="button" class="btn btn-icon" click.trigger="dismissHint()" aria-label="${'panel.close' | t}">✕</button>
    </div>

    <!-- controls bottom -->
    <div class="hud-bottom">
      <div class="details-row" if.bind="session.dialogHidden && session.isOver">
        <button type="button" class="btn details-chip" click.trigger="session.showDialog()">${session.runState === 'crashed' ? '💥' : '🏁'} ${'hud.details' | t}</button>
      </div>
      <div class="hud-card hud-controls flex items-center gap-2 justify-center">
        <button type="button" class="btn" click.trigger="session.reset()" aria-label="${'hud.reset' | t}">↺<span class="hidden sm:inline"> ${'hud.reset' | t}</span></button>
        <button type="button" class="btn btn-primary min-w-28" click.trigger="session.togglePlay()" disabled.bind="session.isOver">
          ${session.isPlaying ? '⏸' : (session.needsRestart ? '↻' : '▶')} ${playLabel | t}
        </button>
        <div class="flex gap-1" role="group" aria-label="${'hud.speed' | t}">
          <button repeat.for="s of speeds" type="button" class="btn btn-speed" active.class="session.speed === s" click.trigger="session.setSpeed(s)">${s}×</button>
        </div>
        <button type="button" class="btn btn-compute" click.trigger="session.computeResult()" title="${'hud.computeHint' | t}" aria-label="${'hud.compute' | t}">⚡<span class="hidden sm:inline"> ${'hud.compute' | t}</span></button>
      </div>
    </div>

    <intersection-panel></intersection-panel>

    <!-- result -->
    <div class="overlay" if.bind="session.runState === 'finished' && session.result && !session.dialogHidden">
      <div class="dialog">
        <h2 class="text-2xl font-bold mb-1">${'result.title' | t}</h2>
        <p class="text-lg font-semibold mb-4" class.bind="session.result.achieved ? 'text-green-700' : 'text-red-700'">
          ${(session.result.achieved ? 'result.achieved' : 'result.missed') | t}
        </p>
        <dl class="grid grid-cols-2 gap-y-1 text-sm mb-4">
          <dt class="opacity-70">${'result.time' | t}</dt><dd class="font-mono tabular-nums text-right">${session.result.time | time}</dd>
          <dt class="opacity-70">${'result.target' | t}</dt><dd class="font-mono tabular-nums text-right">${session.result.targetTime | time}</dd>
          <template if.bind="session.result.previousBest !== null">
            <dt class="opacity-70">${'result.best' | t}</dt><dd class="font-mono tabular-nums text-right">${session.result.previousBest | time}</dd>
            <dt class="opacity-70">${'result.diff' | t}</dt><dd class="font-mono tabular-nums text-right">${diffToBest > 0 ? '+' : ''}${diffToBest | time}</dd>
          </template>
        </dl>
        <p class="text-amber-600 font-semibold mb-4" if.bind="session.result.isNewBest && session.result.previousBest !== null">★ ${'result.newBest' | t}</p>
        <div class="waits" if.bind="topWaits.length">
          <div class="text-xs uppercase tracking-wide opacity-60 mb-1">${'result.waits' | t}</div>
          <div repeat.for="w of topWaits" class="wait-row"><span>${'panel.title' | t: { id: w.name }}</span><span class="font-mono tabular-nums">${w.average.toFixed(1)} s <small>${'result.perVehicle' | t}</small></span><small class="wait-total">${'result.waitTotal' | t: { total: w.totalText, vehicles: w.vehicles }}</small></div>
        </div>
        <div class="flex flex-col gap-2">
          <button type="button" class="btn btn-primary w-full" if.bind="session.result.achieved && nextLevelId" click.trigger="next()">${'result.next' | t} →</button>
          <button type="button" class="btn w-full" active.class="!(session.result.achieved && nextLevelId)" click.trigger="session.reset()">↺ ${'result.again' | t}</button>
          <div class="flex gap-2">
            <button type="button" class="btn grow" click.trigger="session.hideDialog()">🗺 ${'result.viewMap' | t}</button>
            <button type="button" class="btn grow" click.trigger="back()">${(fromEditor ? 'hud.backToEditor' : 'result.menu') | t}</button>
          </div>
        </div>
      </div>
    </div>

    <!-- crash -->
    <div class="overlay" if.bind="session.runState === 'crashed' && session.collision && session.crashDialogVisible && !session.dialogHidden">
      <div class="dialog border-red-300">
        <h2 class="text-2xl font-bold text-red-700 mb-2">💥 ${'crash.title' | t}</h2>
        <p class="mb-2">${'crash.body' | t: { id: crashIntersectionName }}</p>
        <p class="mb-3 text-sm">${crashCauseKey | t: { id: crashCauseIntersectionName }} ${'crash.marked' | t}</p>
        <div class="waits mb-4" if.bind="crashWaits.length">
          <div class="text-xs uppercase tracking-wide opacity-60 mb-1">${'result.waits' | t}</div>
          <div repeat.for="w of crashWaits" class="wait-row"><span>${'panel.title' | t: { id: w.name }}</span><span class="font-mono tabular-nums">${w.average.toFixed(1)} s <small>${'result.perVehicle' | t}</small></span><small class="wait-total">${'result.waitTotal' | t: { total: w.totalText, vehicles: w.vehicles }}</small></div>
        </div>
        <div class="flex flex-col gap-2">
          <button type="button" class="btn btn-primary w-full" click.trigger="session.hideDialog()">🗺 ${'crash.viewMap' | t}</button>
          <div class="flex gap-2">
            <button type="button" class="btn grow" click.trigger="session.reset()">↺ ${'hud.reset' | t}</button>
            <button type="button" class="btn grow" click.trigger="back()">${(fromEditor ? 'hud.backToEditor' : 'result.menu') | t}</button>
          </div>
        </div>
      </div>
    </div>
  </template>
</div>
