<label class="block">
  <div class="flex justify-between items-baseline text-sm mb-1">
    <span class="font-medium">${label}</span>
    <span class="font-mono tabular-nums text-base">${display} ${unit}</span>
  </div>
  <input type="range" class="slider" min.bind="min" max.bind="max" step.bind="step" value.to-view="value"
    disabled.bind="disabled" input.trigger="onInput($event)">
</label>
