name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/stoplicht/package-lock.json

      - name: Install dependencies
        working-directory: src/stoplicht
        run: npm ci

      - name: Build application
        working-directory: src/stoplicht
        # Project sites live under https://<user>.github.io/<repo>/ ; set BASE_PATH=/ when a custom domain (stoplicht.com) is used.
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: SPA fallback for deep links
        working-directory: src/stoplicht
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: src/stoplicht/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
